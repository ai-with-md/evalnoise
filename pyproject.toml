[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evalnoise"
version = "0.1.0"
description = "Where does the noise in an eval score come from? Split it across questions, judges, prompt wordings and runs, and plan where to spend the next API calls"
readme = "README.md"
license = "MIT"
authors = [{name = "Meenal Asesh"}]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "evaluation", "evals", "llm-as-a-judge", "error bars", "generalizability theory", "variance components", "measurement error", "statistics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
evalnoise = "evalnoise.cli:main"

[project.urls]
Homepage = "https://github.com/ai-with-md/evalnoise"
Calculator = "https://ai-with-md.github.io/evalnoise/"
Issues = "https://github.com/ai-with-md/evalnoise/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
